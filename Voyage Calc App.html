<meta name="theme-color" content="#1F4E78">
<style>
:root{
  --navy:#1F4E78; --navy-dark:#122f49; --teal:#2E86AB;
  --bg:#F4F6F8; --card:#FFFFFF; --border:#E2E6EA;
  --text:#0B0B0B; --muted:#52514E;
  /* Status colors — validated palette (dataviz skill): icon + label always pairs with these, never color alone */
  --green:#0CA30C; --green-bg:#E8F7E8;
  --red:#D03B3B; --red-bg:#FBEAEA;
  --amber:#B8860B; --amber-bg:#FFF6E0;
  --radius:14px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;
  padding:14px 16px calc(14px);display:flex;align-items:center;gap:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.12);
}
.topbar .back{cursor:pointer;font-size:20px;padding:2px 8px;border-radius:8px;user-select:none;}
.topbar .back:active{background:rgba(255,255,255,0.15);}
.topbar h1{font-size:17px;font-weight:600;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.topbar .action{font-size:13px;font-weight:600;background:rgba(255,255,255,0.15);border:none;color:#fff;padding:7px 12px;border-radius:20px;cursor:pointer;}
.topbar .action:active{background:rgba(255,255,255,0.3);}
main{flex:1;padding:14px 14px calc(84px + var(--safe-bottom));overflow-x:hidden;}
.navbar{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:#fff;border-top:1px solid var(--border);
  display:flex;justify-content:center;
  padding-bottom:var(--safe-bottom);
}
.navbar-inner{max-width:560px;width:100%;display:flex;}
.navbtn{
  flex:1;text-align:center;padding:9px 4px 8px;background:none;border:none;
  color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;
}
.navbtn .ic{display:block;font-size:20px;line-height:1;margin-bottom:2px;}
.navbtn.active{color:var(--navy);}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 14px;margin-bottom:12px;}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);margin:0 0 10px;}

.searchbar{display:flex;gap:8px;margin-bottom:12px;}
.searchbar input{flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--border);font-size:15px;background:#fff;}
.chiprow{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;}
.chip{flex:none;padding:6px 13px;border-radius:20px;background:#fff;border:1px solid var(--border);font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;}
.chip.active{background:var(--navy);border-color:var(--navy);color:#fff;}

.estcard{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;margin-bottom:10px;cursor:pointer;transition:box-shadow .15s;}
.estcard:active{box-shadow:0 0 0 2px var(--teal) inset;}
.estcard .row1{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;}
.estcard .vessel{font-weight:700;font-size:15px;}
.estcard .trade{font-size:11px;color:var(--muted);background:var(--bg);padding:2px 8px;border-radius:10px;}
.estcard .row2{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);}
.estcard .profit{font-weight:700;font-variant-numeric:tabular-nums;}
.estcard .profit.pos{color:var(--green);}
.estcard .profit.neg{color:var(--red);}

.fab{
  position:fixed;right:calc(50% - 280px + 18px);bottom:calc(80px + var(--safe-bottom));
  width:54px;height:54px;border-radius:50%;background:var(--navy);color:#fff;
  border:none;font-size:26px;box-shadow:0 4px 14px rgba(31,78,120,0.4);cursor:pointer;z-index:25;
  display:flex;align-items:center;justify-content:center;
}
@media (max-width:640px){ .fab{ right:18px; } }

.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;font-weight:600;}
.field input,.field select{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:9px;font-size:16px;background:#fff;color:var(--text);}
.field input:focus,.field select:focus{outline:2px solid var(--teal);border-color:var(--teal);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 8px;}

.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.kpi{background:var(--bg);border-radius:10px;padding:10px 12px;}
.kpi .label{font-size:11px;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.03em;}
.kpi .value{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;}
.kpi.big{grid-column:span 2;background:var(--navy);color:#fff;padding:14px;}
.kpi.big .label{color:rgba(255,255,255,0.75);}
.kpi.big .value{font-size:24px;}
.kpi.pos .value{color:var(--green);}
.kpi.neg .value{color:var(--red);}
.kpi.warnbg{background:var(--amber-bg);}

.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px;}
table.subtable{width:100%;min-width:520px;border-collapse:collapse;font-size:13px;}
table.subtable th{text-align:left;font-size:10.5px;color:var(--muted);text-transform:uppercase;padding:4px 6px;border-bottom:1px solid var(--border);white-space:nowrap;}
table.subtable td{padding:5px 6px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;}
table.subtable input{width:64px;border:none;background:transparent;font-size:13px;padding:3px 2px;color:var(--text);}
table.subtable input[type=text]{width:120px;}
table.subtable input:focus{outline:1px solid var(--teal);border-radius:4px;background:#fff;}
table.subtable tr:last-child td{border-bottom:none;}
.rowdel{color:var(--red);font-size:16px;cursor:pointer;padding:2px 6px;}
.parcelbox{border:1px solid var(--border);border-radius:10px;padding:10px 12px 4px;margin-bottom:10px;background:var(--bg);}
.parcelbox .phead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700;font-size:13px;color:var(--navy);}
.parcelbox .phead .rowdel{font-size:12px;font-weight:600;padding:2px 0;}
.addrow-btn{margin-top:8px;background:none;border:1px dashed var(--border);color:var(--navy);border-radius:8px;padding:7px;width:100%;font-size:13px;font-weight:600;cursor:pointer;}
.smallbtn{background:var(--bg);border:1px solid var(--border);color:var(--navy);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;margin-top:6px;}

.flagbox{background:var(--amber-bg);border:1px solid #EFDDA6;border-radius:10px;padding:10px 12px;font-size:12.5px;color:#7A5B00;margin-bottom:12px;}
.emptystate{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px;}
.emptystate .emptyicon{font-size:40px;margin-bottom:10px;opacity:0.5;}
.emptystate .emptytitle{font-size:16px;font-weight:700;color:var(--text);margin-bottom:4px;}
.footer-actions{display:flex;gap:10px;margin-top:4px;}
.footer-actions button{flex:1;padding:11px;border-radius:10px;border:none;font-weight:700;font-size:14px;cursor:pointer;}
.btn-danger{background:var(--red-bg);color:var(--red);}
.btn-primary{background:var(--navy);color:#fff;}
.hint{font-size:12px;color:var(--muted);margin-top:4px;}
.tankqty{font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;}
.vesseltotal{background:var(--navy);color:#fff;border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.vesseltotal .n{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;}
input[type=file]{font-size:13px;}
a.dl{display:block;text-align:center;text-decoration:none;}

.loginwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,var(--navy),var(--navy-dark));}
.loginbox{background:#fff;border-radius:18px;padding:30px 26px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,0.25);}
.loginbox .logo{display:block;margin:0 auto 18px;height:56px;width:auto;}
.loginbox h1{font-size:19px;margin:0 0 4px;color:var(--navy);text-align:center;}
.loginbox .sub{font-size:13px;color:var(--muted);margin:0 0 22px;text-align:center;}
.loginbox .field{margin-bottom:14px;}
.loginbox input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--border);font-size:16px;}
.loginbox button[type="submit"]{width:100%;padding:12px;border-radius:10px;border:none;background:var(--navy);color:#fff;font-weight:700;font-size:15px;cursor:pointer;margin-top:6px;}
.loginbox .err{color:var(--red);font-size:13px;margin:0 0 10px;min-height:16px;}
.loginbox .disclaimer{font-size:11px;color:var(--muted);margin-top:18px;line-height:1.5;border-top:1px solid var(--border);padding-top:14px;}
</style>
</head>

function initAuth(){
  const form = document.getElementById('loginForm');
  const err = document.getElementById('loginErr');
  const pwField = document.getElementById('loginPassword');
  const toggle = document.getElementById('togglePw');
  if (toggle){
    toggle.addEventListener('click', () => {
      const showing = pwField.type === 'text';
      pwField.type = showing ? 'password' : 'text';
      toggle.textContent = showing ? 'SHOW' : 'HIDE';
    });
  }
  form.addEventListener('submit', ev => {
    ev.preventDefault();
    // Mobile keyboards (autocapitalize/autocorrect/predictive text) can silently add
    // leading/trailing spaces or change casing — trim both sides and match email
    // case-insensitively so that doesn't cause a false "wrong password".
    const emailRaw = document.getElementById('loginEmail').value.trim();
    const email = emailRaw.toLowerCase();
    const pass = pwField.value.trim();
    const record = USER_CREDENTIALS[email];
    if (!record){ err.textContent = 'That email is not on the team access list. Contact your admin.'; return; }

    state.currentUser = emailRaw;
    state.currentUserName = record.name;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = '';
    render();
  });
}
function logout(){
  state.currentUser = null; state.currentUserName = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPassword').value = '';
  document.getElementById('loginErr').textContent = '';
}

  view: 'list', currentEstimateId: null, currentVesselName: null,
  search: '', vesselFilter: 'All', _density: 0.85,
};

function loadSeed(){
  state.vessels   = JSON.parse(JSON.stringify(SEED.vessels));
  state.estimates = JSON.parse(JSON.stringify(SEED.estimates));
  state.parcels   = JSON.parse(JSON.stringify(SEED.parcels));
  state.tanks     = JSON.parse(JSON.stringify(SEED.tanks));
  state.nextEstimateId = SEED.nextEstimateId;
  state.nextParcelId   = SEED.nextParcelId;
}
loadSeed();

// ---------- helpers ----------
const $ = sel => document.querySelector(sel);
const fmtUSD = n => {
  if (n === null || n === undefined || isNaN(n)) return '-';
  const neg = n < 0;
  const v = Math.round(Math.abs(n)).toLocaleString('en-US');
  return (neg ? '($' : '$') + v + (neg ? ')' : '');
};
const fmtNum = (n, d=2) => (n===null||n===undefined||isNaN(n)) ? '-' : Number(n).toLocaleString('en-US', {maximumFractionDigits:d, minimumFractionDigits:0});
const byId = (arr, id) => arr.find(x => x.id === id);
const vesselOf = name => state.vessels.find(v => v.name === name) || state.vessels[0];
const parcelsFor = eid => state.parcels.filter(p => p.estimateId === eid).sort((a,b)=>a.parcelNo-b.parcelNo);
function escapeAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// Re-render while preserving keyboard focus & cursor position, so typing a multi-digit
// number doesn't get interrupted every keystroke by the DOM rebuild. Every input we
// live-recompute against must have a unique `id` for this to find its way back.
function rerender(renderFn){
  const active = document.activeElement;
  const activeId = (active && active.id) ? active.id : null;
  // Keep exactly what the user typed (e.g. a trailing "12." while entering "12.5") —
  // we recompute from the parsed number for everything else, but the field the user
  // is actively editing should never get silently reformatted mid-keystroke.
  const rawValue = active && activeId ? active.value : null;
  const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;
  renderFn();
  if (activeId){
    const el = document.getElementById(activeId);
    if (el){
      if (rawValue !== null && 'value' in el) el.value = rawValue;
      el.focus();
      // Default to end-of-value when the browser can't tell us the caret position
      // (e.g. right after this exact element was just recreated) — appending digits
      // is the overwhelmingly common case for these fields.
      const s = selStart !== null ? selStart : el.value.length;
      const e2 = selEnd !== null ? selEnd : el.value.length;
      if (el.setSelectionRange){
        try { el.setSelectionRange(s, e2); } catch(err){}
      }
    }
  }
}

// ---------- core calc engine ----------
// Loading/Discharging days are ALWAYS derived automatically from cargo qty ÷ rate ÷ 24 —
// never entered by hand — same as the original spreadsheet.
function autoPortDays(ps, field){
  return ps.reduce((s,p) => s + ((p[field] && p[field]!==0) ? (p.quantity||0)/p[field] : 0), 0) / 24;
}

function getEcaProfile(vessel){
  if (vessel.hasEca && vessel.eca && Object.keys(vessel.eca).length){
    return { profile: vessel.eca, isReal: true };
  }
  // No ECA profile set for this vessel yet — fall back to non-ECA rates re-cast as
  // "all fuel switches to MDO", flagged as an estimate rather than vessel-confirmed data.
  const n = vessel.nonEca;
  return {
    isReal: false,
    profile: {
      ladenNonEcaIFO:n.ladenIFO, ladenNonEcaMDO:n.ladenMDO, ladenEcaIFO:0, ladenEcaMDO:round2(n.ladenIFO+n.ladenMDO),
      ballastNonEcaIFO:n.ballastIFO, ballastNonEcaMDO:n.ballastMDO, ballastEcaIFO:0, ballastEcaMDO:round2(n.ballastIFO+n.ballastMDO),
      loadIFO:0, loadMDO:round2(n.loadIFO+n.loadMDO), dischIFO:0, dischMDO:round2(n.dischIFO+n.dischMDO),
      idleIFO:0, idleMDO:round2(n.idleIFO+n.idleMDO),
    }
  };
}
function round2(n){ return Math.round(n*100)/100; }

function buildPhases(est){
  const vessel = vesselOf(est.vessel);

  const loadDays = autoPortDays(ps, 'loadingRate');

  if (est.trade === 'ECA'){

      {name:'Laden at Sea – ECA', days:est.ladenEcaDays||0, ifoRate:profile.ladenEcaIFO, mdoRate:profile.ladenEcaMDO},
      {name:'Ballast at Sea – Non-ECA', days:est.ballastDays||0, ifoRate:profile.ballastNonEcaIFO, mdoRate:profile.ballastNonEcaMDO},
      {name:'Ballast at Sea – ECA', days:est.ballastEcaDays||0, ifoRate:profile.ballastEcaIFO, mdoRate:profile.ballastEcaMDO},
      {name:'Loading Operation', days:loadDays, ifoRate:profile.loadIFO, mdoRate:profile.loadMDO},
      {name:'Discharging Operation', days:dischDays, ifoRate:profile.dischIFO, mdoRate:profile.dischMDO},
      {name:'Idle / Waiting at Anchorage', days:est.idleDays||0, ifoRate:profile.idleIFO, mdoRate:profile.idleMDO},
    ];

      {name:'Loading Operation', days:loadDays, ifoRate:p.loadIFO, mdoRate:p.loadMDO},
      {name:'Discharging Operation', days:dischDays, ifoRate:p.dischIFO, mdoRate:p.dischMDO},
      {name:'Idle / Waiting at Anchorage', days:est.idleDays||0, ifoRate:p.idleIFO, mdoRate:p.idleMDO},
    ];
  }
  list.forEach(ph => {
    ph.ifoMt = ph.days * (ph.ifoRate||0);
    ph.mdoMt = ph.days * (ph.mdoRate||0);
    ph.ifoCost = ph.ifoMt * (Number(est.ifoPrice)||0);
    ph.mdoCost = ph.mdoMt * (Number(est.mgoPrice)||0);
    ph.totalCost = ph.ifoCost + ph.mdoCost;
  });
  return { list, ecaWarning };
}

function computeTotals(estId){
  const est = byId(state.estimates, estId);
  if (!est) return null;
  const vessel = vesselOf(est.vessel);
  const ps = parcelsFor(est.id);
  const { list: phs, ecaWarning } = buildPhases(est);

  const totalDays = phs.reduce((s,p)=>s+p.days, 0);
  const totalBunker = phs.reduce((s,p)=>s+p.totalCost, 0);
  const totalQty = ps.reduce((s,p)=>s+(Number(p.quantity)||0), 0);
  const freightIncome = ps.reduce((s,p)=>s+(Number(p.quantity)||0)*(Number(p.freightRate)||0), 0);
  const totalCommission = ps.reduce((s,p)=>s+(Number(p.quantity)||0)*(Number(p.freightRate)||0)*((Number(p.adcom)||0)+(Number(p.comm)||0)), 0);
  const hireCost = totalDays * (Number(vessel.hireRate)||0);
  const totalShipping = totalBunker + (Number(est.pdaLoad)||0) + (Number(est.pdaDisch)||0) + (Number(est.hraCost)||0) + (Number(est.canalCost)||0) + hireCost;
  const netCost = totalShipping + totalCommission;
  const profit = freightIncome - netCost;
  const tce = freightIncome - (netCost - hireCost);
  const tcePerDay = totalDays !== 0 ? tce / totalDays : 0;
  const breakevenPerMt = totalQty !== 0 ? netCost / totalQty : 0;

  const p1 = ps.find(p => p.parcelNo === 1);
  const p1rate = p1 ? (Number(p1.adcom)||0)+(Number(p1.comm)||0) : 0;
  const demurrage = (1 - p1rate) !== 0 ? ((Number(vessel.hireRate)||0) + 3.5*(Number(est.ifoPrice)||0)) / (1 - p1rate) : 0;

  return { phases: phs, ecaWarning, totalDays, totalQty, totalBunker, freightIncome, totalCommission,
    hireCost, totalShipping, netCost, profit, tce, tcePerDay, breakevenPerMt, demurrage };
}

// ---------- router ----------
function go(view, param){
  state.view = view;
  if (view === 'detail') state.currentEstimateId = param;
  if (view === 'vesseldetail') state.currentVesselName = param;
  render();
  window.scrollTo(0,0);
}

function render(){
  renderTopbar(); renderNav();
  const main = $('#main'); main.innerHTML = '';
  const fab = $('#fab'); fab.style.display = 'none'; fab.onclick = null;
  if (state.view === 'list') renderList(main, fab);
  else if (state.view === 'detail') renderDetail(main);
  else if (state.view === 'vessels') renderVesselList(main, fab);
  else if (state.view === 'vesseldetail') renderVesselDetail(main);
  else if (state.view === 'data') renderData(main);
}

function blankVesselProfile(){
  return {ladenIFO:0, ladenMDO:0, ballastIFO:0, ballastMDO:0, loadIFO:0, loadMDO:0, dischIFO:0, dischMDO:0, idleIFO:0, idleMDO:0};
}
function addVessel(){
  const name = (prompt('New vessel name (e.g. official ship name):') || '').trim();
  if (!name) return;
  if (state.vessels.some(v => v.name.toLowerCase() === name.toLowerCase())){
    alert('A vessel with that name already exists.');
    return;
  }
  state.vessels.push({ name, hasEca:false, hireRate:0, nonEca: blankVesselProfile(), eca: {} });
  go('vesseldetail', name);
}
function deleteVessel(name){
  const usedBy = state.estimates.filter(e => e.vessel === name);
  const msg = usedBy.length
    ? `${usedBy.length} voyage estimate(s) use ${name}. Deleting this vessel will also delete those estimates and their cargo parcels. Continue?`
    : `Delete ${name} and its tank table? This can't be undone.`;
  if (!confirm(msg)) return;
  const idsToRemove = usedBy.map(e => e.id);
  state.estimates = state.estimates.filter(e => e.vessel !== name);
  state.parcels = state.parcels.filter(p => !idsToRemove.includes(p.estimateId));
  state.tanks = state.tanks.filter(t => t.vessel !== name);
  state.vessels = state.vessels.filter(v => v.name !== name);
  go('vessels');
}

function renderTopbar(){
  const bar = $('#topbar');
  let title = 'Voyage Calc', showBack = false, action = null;
  if (state.view === 'list'){ title = 'Voyage Estimates'; }
  else if (state.view === 'detail'){
    const est = byId(state.estimates, state.currentEstimateId);
    title = est ? (est.vessel + ' — ' + est.trade) : 'Estimate';
    showBack = true;
    action = {label:'Delete', fn: () => deleteEstimate(state.currentEstimateId)};
  }
  else if (state.view === 'vessels'){ title = 'Vessels'; }
  else if (state.view === 'vesseldetail'){
    title = state.currentVesselName; showBack = true;
    action = {label:'Delete', fn: () => deleteVessel(state.currentVesselName)};
  }
  else if (state.view === 'data'){ title = 'Backup & Data'; }

  bar.innerHTML = `${showBack ? '<span class="back" id="backBtn">&#8592;</span>' : ''}<h1>${title}</h1>${action ? `<button class="action" id="topAction">${action.label}</button>` : ''}`;
  if (showBack) $('#backBtn').onclick = () => go(state.view === 'vesseldetail' ? 'vessels' : 'list');
  if (action) $('#topAction').onclick = action.fn;
}

function renderNav(){
  const nav = $('#navbar');
  const items = [
    {v:'list', ic:'&#128220;', label:'Estimates'},
    {v:'vessels', ic:'&#9875;', label:'Vessels'},
    {v:'data', ic:'&#128190;', label:'Backup'},
  ];
  nav.innerHTML = items.map(it => `<button class="navbtn ${(state.view===it.v || (it.v==='vessels'&&state.view==='vesseldetail')) ? 'active':''}" data-v="${it.v}"><span class="ic">${it.ic}</span>${it.label}</button>`).join('');
  nav.querySelectorAll('.navbtn').forEach(btn => btn.onclick = () => go(btn.dataset.v));
}

// ---------- Estimates List ----------
function renderList(main, fab){
  fab.style.display = 'flex';
  fab.onclick = () => {
    const id = state.nextEstimateId++;
    const v = state.vessels[0];
    state.estimates.push({id, vessel:v.name, trade:'NON-ECA', ifoPrice:0, mgoPrice:0,
      pdaLoad:0, pdaDisch:0, hraCost:0, canalCost:0, ladenDays:0, ladenEcaDays:0, ballastDays:0, ballastEcaDays:0, idleDays:0});
    const pid = state.nextParcelId++;
    state.parcels.push({id:pid, estimateId:id, parcelNo:1, quantity:0, loadingRate:150, dischargeRate:150, freightRate:0, adcom:0.025, comm:0.025});
    go('detail', id);
  };

  const vessels = ['All', ...state.vessels.map(v=>v.name)];
  const wrap = document.createElement('div');
  const search = document.createElement('div');
  search.className = 'searchbar';
  search.innerHTML = `<input type="text" id="searchInput" placeholder="Search vessel or trade..." value="${state.search.replace(/"/g,'&quot;')}">`;
  wrap.appendChild(search);

  const chips = document.createElement('div');
  chips.className = 'chiprow';
  chips.innerHTML = vessels.map(v => `<div class="chip ${state.vesselFilter===v?'active':''}" data-v="${v}">${v}</div>`).join('');
  wrap.appendChild(chips);

  const list = document.createElement('div');
  const filtered = state.estimates.filter(e => {
    const matchesSearch = !state.search || (e.vessel+' '+e.trade).toLowerCase().includes(state.search.toLowerCase());
    const matchesChip = state.vesselFilter==='All' || e.vessel===state.vesselFilter;
    return matchesSearch && matchesChip;
  });

  if (filtered.length === 0){
    const emptyMsg = state.estimates.length === 0
      ? `<div class="emptystate"><div class="emptyicon">&#128220;</div><div class="emptytitle">No voyage estimates yet</div><div>Tap the + button to build your first one.</div></div>`
      : `<div class="emptystate"><div class="emptyicon">&#128269;</div><div class="emptytitle">No matches</div><div>Try a different search or vessel filter.</div></div>`;
    list.innerHTML = emptyMsg;
  } else {
    filtered.forEach(e => {
      const t = computeTotals(e.id);
      const card = document.createElement('div');
      card.className = 'estcard';
      const arrow = t.profit>=0 ? '&#9650;' : '&#9660;';
      card.innerHTML = `
        <div class="row1"><span class="vessel">${e.vessel}</span><span class="trade">${e.trade}</span></div>
        <div class="row2"><span>${fmtNum(t.totalDays,1)} days &middot; ${fmtNum(t.totalQty,0)} mt</span>
        <span class="profit ${t.profit>=0?'pos':'neg'}">${arrow} ${fmtUSD(t.profit)}</span></div>`;
      card.onclick = () => go('detail', e.id);
      list.appendChild(card);
    });
  }
  wrap.appendChild(list);
  main.appendChild(wrap);
  $('#searchInput').addEventListener('input', e => { state.search = e.target.value; render(); const el=$('#searchInput'); if(el){el.focus(); el.selectionStart=el.selectionEnd=el.value.length;} });
  chips.querySelectorAll('.chip').forEach(c => c.onclick = () => { state.vesselFilter = c.dataset.v; render(); });
}

    rerender(() => renderDetail(main));

    if (hint){

function deleteEstimate(id){

    <div class="hint">This is the one Hire Rate used for every voyage estimate on ${vessel.name} — it won't show as editable on individual estimates.</div>`;
  main.appendChild(commCard);
  commCard.querySelector('#vp_hireRate').addEventListener('input', e => { vessel.hireRate = parseFloat(e.target.value)||0; });

  const nonCard = document.createElement('div');
  nonCard.className = 'card';
  nonCard.innerHTML = `<h2>Fixed Consumption Profile — Non-ECA</h2>
    <div class="grid2" id="nonEcaFields"></div>
    <div class="hint">These rates rarely change — set once per vessel, then every new voyage estimate uses them automatically.</div>`;
  main.appendChild(nonCard);
  const nonWrap = nonCard.querySelector('#nonEcaFields');
  profileFieldsNonEca().forEach(([key,label]) => {
    const d = document.createElement('div'); d.className = 'field';
    d.innerHTML = `<label>${label}</label><input type="text" inputmode="decimal" step="0.1" data-k="${key}" value="${vessel.nonEca[key]||0}">`;
    nonWrap.appendChild(d);
  });
  nonWrap.querySelectorAll('input').forEach(inp => inp.addEventListener('input', e => {
    vessel.nonEca[e.target.dataset.k] = parseFloat(e.target.value)||0;
  }));

  const ecaCard = document.createElement('div');
  ecaCard.className = 'card';
  ecaCard.innerHTML = `<h2>Fixed Consumption Profile — ECA trade</h2>
    <div class="field" style="display:flex;align-items:center;gap:8px;">
      <input type="checkbox" id="hasEcaChk" ${vessel.hasEca?'checked':''} style="width:auto;">
      <label style="margin:0;">This vessel has a confirmed ECA-trade profile</label>
    </div>
    <div class="grid2" id="ecaFields" style="${vessel.hasEca?'':'opacity:0.4;pointer-events:none;'}"></div>`;
  main.appendChild(ecaCard);
  if (!vessel.eca) vessel.eca = {};
  profileFieldsEca().forEach(([key,label]) => { if (vessel.eca[key]===undefined) vessel.eca[key]=0; });
  const ecaWrap = ecaCard.querySelector('#ecaFields');
  profileFieldsEca().forEach(([key,label]) => {
    const d = document.createElement('div'); d.className = 'field';
    d.innerHTML = `<label>${label}</label><input type="text" inputmode="decimal" step="0.1" data-k="${key}" value="${vessel.eca[key]||0}">`;
    ecaWrap.appendChild(d);
  });
  ecaWrap.querySelectorAll('input').forEach(inp => inp.addEventListener('input', e => {
    vessel.eca[e.target.dataset.k] = parseFloat(e.target.value)||0;
  }));
  ecaCard.querySelector('#hasEcaChk').addEventListener('change', e => {
    vessel.hasEca = e.target.checked;
    ecaWrap.style.opacity = vessel.hasEca ? '1' : '0.4';
    ecaWrap.style.pointerEvents = vessel.hasEca ? 'auto' : 'none';
  });

  // Tanks
  const tanks = state.tanks.filter(t=>t.vessel===vessel.name);
  const tankCard = document.createElement('div');
  tankCard.className = 'card';
  tankCard.innerHTML = `<h2>Tanks &amp; Loadable Quantity</h2>
    <div class="field"><label>Cargo Density (mt/m&sup3;) — enter per cargo</label><input type="text" inputmode="decimal" step="0.001" id="densityInput" value="${state._density}"></div>
    <div id="tankTotalWrap"></div>
    <div class="tablewrap"><table class="subtable"><thead><tr><th>Tank</th><th>Capacity 100%</th><th>Corrected</th><th>Loadable (mt)</th></tr></thead><tbody id="tankBody"></tbody></table></div>`;
  main.appendChild(tankCard);
  function renderTankRows(){
    const dens = state._density;
    let totalQty = 0;
    const body = tankCard.querySelector('#tankBody');
    body.innerHTML = '';
    tanks.forEach(tk => {
      const corrected = tk.capacity100 * tk.correction;
      const qty = corrected * dens * 0.98;
      totalQty += qty;
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${tk.tankName}</td><td>${fmtNum(tk.capacity100,1)}</td><td>${fmtNum(corrected,1)}</td><td class="tankqty">${fmtNum(qty,1)}</td>`;
      body.appendChild(tr);
    });
    tankCard.querySelector('#tankTotalWrap').innerHTML = `<div class="vesseltotal"><span>Total loadable qty</span><span class="n">${fmtNum(totalQty,0)} mt</span></div>`;
  }
  renderTankRows();
  tankCard.querySelector('#densityInput').addEventListener('input', e => { state._density = parseFloat(e.target.value)||0; renderTankRows(); });
}

// ---------- Data / Backup ----------
function renderData(main){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
      <div><div style="font-size:11px;color:var(--muted);text-transform:uppercase;">Signed in as</div><div style="font-weight:700;">${escapeAttr(state.currentUserName||'')}</div><div style="font-size:12px;color:var(--muted);">${escapeAttr(state.currentUser||'')}</div></div>
      <button class="smallbtn" id="logoutBtn" style="margin-top:0;">Sign out</button>
    </div>
    <div class="flagbox">Your data lives in this browser tab only — closing it clears everything. Export a backup before you close, and Import it next time to pick up where you left off.</div>
    <div class="card"><h2>Export backup</h2>
      <p style="font-size:13px;color:var(--muted);margin:0 0 10px;">Downloads a JSON file with every vessel profile, estimate, and cargo parcel on this device.</p>
      <div class="footer-actions"><button class="btn-primary" id="exportBtn">Export backup (.json)</button></div></div>
    <div class="card"><h2>Import backup</h2>
      <p style="font-size:13px;color:var(--muted);margin:0 0 10px;">Loads a previously exported file, replacing everything currently shown.</p>
      <input type="file" id="importFile" accept="application/json"></div>
    <div class="card"><h2>Reset</h2>
      <p style="font-size:13px;color:var(--muted);margin:0 0 10px;">Restore the 19 sample estimates and 4 vessel profiles this app shipped with.</p>
      <div class="footer-actions"><button class="btn-danger" id="resetBtn">Reset to sample data</button></div></div>`;
  main.appendChild(wrap);

  $('#exportBtn').onclick = () => {
    const data = { vessels: state.vessels, estimates: state.estimates, parcels: state.parcels, tanks: state.tanks,
      nextEstimateId: state.nextEstimateId, nextParcelId: state.nextParcelId };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'voyage-calc-backup-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
  $('#importFile').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        state.vessels = data.vessels || state.vessels;
        state.estimates = data.estimates || [];
        state.parcels = data.parcels || [];
        state.tanks = data.tanks || state.tanks;
        state.nextEstimateId = data.nextEstimateId || (Math.max(0,...state.estimates.map(x=>x.id))+1);
        state.nextParcelId = data.nextParcelId || (Math.max(0,...state.parcels.map(x=>x.id))+1);
        alert('Backup loaded.');
        go('list');
      } catch(err){ alert('Could not read that file: ' + err.message); }
    };
    reader.readAsText(file);
  });
  $('#resetBtn').onclick = () => { if (confirm('Replace current data with the original sample data?')){ loadSeed(); go('list'); } };
  $('#logoutBtn').onclick = () => { if (confirm('Sign out?')) logout(); };
}

// ---------- boot ----------
initAuth();

</script>
</body>
</html>
